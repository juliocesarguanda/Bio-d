<!DOCTYPE html>
<html lang="es">
<head>
    <!-- <base href="https://bio-d.org/"> -->
    <meta charset="UTF-8">
    <title>Bio-D</title>
    <meta name="robots" content="noachive">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <!-- <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    form-action 'self';
  "> -->
    
 <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/loader.css">
    <link rel="stylesheet" href="assets/css/librerias/bell.min.css">
    <link rel="icon" href="assets/img/png/logo.png">
    <script src="assets/js/librerias/bell.min.js"></script>
</head>

<body>
    <div class="rootd">
       
    <div id="loader">
        <div class="loader"></div>
      </div>

    <div class="container">
        <div class="form-section" id="loginSection">
            <img src="assets/img/png/logo.png" alt="Logo de Bio-D, círculos conectados en espiral"
                class="logo" width="200" height="200">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="input-container">
                    <input name="username" class="upperCase" type="text"  maxlength="30" id="username" required>
                    <label for="username">Usuario</label>
                </div>
                <div class="input-container">
                    <input name="password"  type="password" id="password"  maxlength="30" required>
                    <label for="password">Contraseña</label>
                    <svg class="toggle-password" id="togglePassword1" onclick="togglePassword('password','togglePassword1')" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <button type="submit">Ingresar</button>
            </form>
            <div class="contenedor-links">

            <a class="form-link" id="forgotPasswordLink">¿Olvidó su contraseña?</a>
            <a class="form-link" target="_blank" href="#" >¿Ayuda?</a>
            </div>

        </div>

        <div class="image-section" id="imageSection"></div>

        <div class="form-section" id="recoverSection">
            <img src="assets/img/png/logo.png" alt="Logo de Bio-D, círculos conectados en espiral"
                class="logo" width="200" height="200">
            <h2>Recuperar Contraseña</h2>
            <form id="recoverForm">
                <div class="input-container">
                     <input type="text" class="upperCase" id="recoverUsername" name="recoverUsername"  maxlength="30"  required>
                    <label for="recoverUsername">Usuario</label>
                </div>
                <button type="submit">Recuperar Contraseña</button>
            </form>
            <a class="form-link" id="backToLoginLink">Volver a Iniciar Sesión</a>
        </div>
    </div>

    <div id="codeModal" class="modal">
        <div class="modal-content">
            <span class="close"><span class="close-modal"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path fill="currentColor" d="m476-420 84-84 84 84 56-56-84-84 84-84-56-56-84 84-84-84-56 56 84 84-84 84 56 56ZM320-240q-33 0-56.5-23.5T240-320v-480q0-33 23.5-56.5T320-880h480q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H320Zm0-80h480v-480H320v480ZM160-80q-33 0-56.5-23.5T80-160v-560h80v560h560v80H160Zm160-720v480-480Z"/></svg></span></span>
            <h2>Verificar Código</h2>
            <p>Ingrese el código de 6 dígitos enviado a su correo electrónico.</p>
            <form id="codeForm">
                <div class="code-input-container">
                     <input name="codigo1" type="text" class="code-input" maxlength="1" required>
                     <input name="codigo2" type="text" class="code-input" maxlength="1" required>
                     <input name="codigo3" type="text" class="code-input" maxlength="1" required>
                    <span class="code-separator">-</span>
                     <input name="codigo4" type="text" class="code-input" maxlength="1" required>
                     <input name="codigo5" type="text" class="code-input" maxlength="1" required>
                     <input name="codigo6" type="text" class="code-input" maxlength="1" required>
                </div>
                <button type="submit">Verificar</button>
            </form>
        </div>
    </div>

    <div id="newPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close"><span class="close-modal"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path fill="currentColor" d="m476-420 84-84 84 84 56-56-84-84 84-84-56-56-84 84-84-84-56 56 84 84-84 84 56 56ZM320-240q-33 0-56.5-23.5T240-320v-480q0-33 23.5-56.5T320-880h480q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H320Zm0-80h480v-480H320v480ZM160-80q-33 0-56.5-23.5T80-160v-560h80v560h560v80H160Zm160-720v480-480Z"/></svg></span></span>
            <h2>Cambiar Contraseña</h2>
            <form id="newPasswordForm">
                <div class="input-container">
                    <input type="password" id="newPassword" name="newPassword"  maxlength="30" required>
                    <label for="newPassword">Nueva Contraseña</label>
                    <svg class="toggle-password" id="togglePassword2" onclick="togglePassword('newPassword','togglePassword2')" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <button type="submit">Cambiar Contraseña</button>
            </form>
        </div>
    </div> 
    </div>

  <script src="assets/js/login/index.js"></script>
<script src="assets/js/loader/loader.js"></script>
</body>

</html>
